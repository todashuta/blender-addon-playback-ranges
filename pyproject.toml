[project]
name = "blender-addon-playback-ranges"
version = "0.0.0"
description = "Playback Ranges Addon"
requires-python = ">=3.11.11"
dependencies = [
	"fake-bpy-module-4.5",
	"ty",
	"ruff",

    #"bpy==4.2.15",
    #"pylsp-mypy>=0.7.0",
    #"python-lsp-server[all]>=1.13.2",

    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-rtd-theme>=3.0.2",
]

#[tool.uv.sources]
#bpy = {index = "download.blender.org"}
#
#[[tool.uv.index]]
#name = "download.blender.org"
#url = "https://download.blender.org/pypi/"

[tool.ruff.lint]
# Blender の bl_options はクラス属性として定義するのが API の作法で、実行時に書き換えない。
# RUF012（mutable default）はこのパターンを誤検知するため無視する。
ignore = ["RUF012"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
